<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Payvori Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky product header over a single working column; tables are the main surface, panels in tint, one cyan action per view. */
:root{
  --bg:#fbfaf7; --card:#fbfaf7; --panel:#e6ecf3; --panel-2:#f1f3f6;
  --line:#e0e3e7; --line-strong:#cdd2d9;
  --fg:#231f1e; --fg-2:#5f6670; --fg-3:#737a84;
  --struct:#4a5a6c; --mark:#4a5a6c; --deep:#1e2733;
  --action:#32a8c7; --action-hover:#2b93af; --action-press:#257f98; --action-ink:#231f1e;
  --warn:#8a5a0b; --warn-bg:#f5ead3; --neg:#9b3a2f; --neg-bg:#f6e3df;
  --scrim:rgba(30,39,51,.42); --shadow:0 2px 8px rgba(35,31,30,.10);
  --header-bg:rgba(251,250,247,.92);
  --sans:'Instrument Sans',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,0,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171e27; --card:#1b2330; --panel:#232e3c; --panel-2:#1f2935;
  --line:#2c3746; --line-strong:#3c4858;
  --fg:#e8eaed; --fg-2:#a9adb4; --fg-3:#8b929b;
  --struct:#a3b3c6; --mark:#fbfaf7; --deep:#0f141b;
  --warn:#e3b764; --warn-bg:#3a3020; --neg:#f0958a; --neg-bg:#3d2522;
  --scrim:rgba(5,8,12,.6); --shadow:0 2px 8px rgba(0,0,0,.35);
  --header-bg:rgba(23,30,39,.92); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171e27; --card:#1b2330; --panel:#232e3c; --panel-2:#1f2935;
  --line:#2c3746; --line-strong:#3c4858;
  --fg:#e8eaed; --fg-2:#a9adb4; --fg-3:#8b929b;
  --struct:#a3b3c6; --mark:#fbfaf7; --deep:#0f141b;
  --warn:#e3b764; --warn-bg:#3a3020; --neg:#f0958a; --neg-bg:#3d2522;
  --scrim:rgba(5,8,12,.6); --shadow:0 2px 8px rgba(0,0,0,.35);
  --header-bg:rgba(23,30,39,.92); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);font-weight:500}
.muted{color:var(--fg-2)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header-bg);backdrop-filter:blur(6px);border-bottom:3px solid var(--struct)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--mark);text-decoration:none}
.brand svg{height:26px;width:auto}
.brand .wm{font-weight:600;font-size:21px;letter-spacing:-.035em;color:var(--fg)}
.brand .prod{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);padding-left:10px;border-left:1px solid var(--line-strong)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:4px;color:var(--fg-2);cursor:pointer;font-weight:500;transition:background .12s var(--ease),color .12s var(--ease)}
.tab:hover{background:var(--panel);color:var(--fg)}
.tab[aria-current="page"]{background:var(--panel);color:var(--fg)}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.dot.live{background:var(--action);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{50%{opacity:.35}}

main{padding-block:32px 72px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:30px;letter-spacing:-.03em;line-height:1.15}
.page-head .sub{color:var(--fg-2);max-width:62ch;margin-top:6px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--struct);margin-bottom:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s var(--ease)}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.btn.primary:hover{background:var(--action-hover);border-color:var(--action-hover)}
.btn.primary:active{background:var(--action-press)}
.btn.ghost{border-color:transparent;color:var(--struct);padding:0 8px}
.btn.ghost:hover{background:transparent;text-decoration:underline}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.sm{height:30px;padding:0 10px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.icon-btn{border:0;background:transparent;width:32px;height:32px;display:grid;place-items:center;border-radius:4px;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{background:var(--panel);color:var(--fg)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:4px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--panel-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
tfoot td{font-weight:600;background:var(--panel-2);border-top:1px solid var(--line-strong)}
.cell-main{font-weight:500}
.cell-sub{font-family:var(--mono);font-size:12px;color:var(--fg-3)}

/* Chips & pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border:1px solid var(--line-strong);color:var(--fg-2)}
.pill.approved{border-color:var(--action);color:var(--fg)}
.pill.approved::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--action)}
.pill.paid{background:var(--panel);border-color:var(--panel);color:var(--fg)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.pill.neg{background:var(--neg-bg);border-color:var(--neg-bg);color:var(--neg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:3px 8px;border-radius:3px;background:var(--panel);font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--fg-2)}
.chip.house{background:transparent;border:1px dashed var(--line-strong);color:var(--fg-2)}

/* Split bar */
.splitbar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--panel);min-width:90px}
.splitbar span{display:block;height:100%}
.splitbar span+span{border-left:1px solid var(--card)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--panel);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1.15}
.tile .s{font-size:13px;color:var(--fg-2)}
.tile.alert{background:var(--warn-bg)}
.tile.alert .v,.tile.alert .label{color:var(--warn)}
.tile.neg{background:var(--neg-bg)}
.tile.neg .v,.tile.neg .label{color:var(--neg)}
.negtext{color:var(--neg)}

/* Panels, notes */
.panel{background:var(--panel);border-radius:4px;padding:20px}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-bottom:16px;font-size:14px}
.note.info{background:var(--panel);color:var(--fg)}
.note .btn{margin-left:auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.search input{padding-left:34px}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);margin-bottom:16px;overflow-x:auto}
.subtab{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--fg-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--struct)}
.subtab .count{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-left:4px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:500;color:var(--fg-2)}
.field .hint{font-size:12.5px;color:var(--fg-3)}
input[type=text],input[type=email],input[type=number],input[type=month],input[type=date],select,textarea{height:38px;padding:0 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--card);width:100%;min-width:0}
textarea{height:auto;padding:8px 10px;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--action);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}

/* Splits editor */
.splits{display:flex;flex-direction:column;gap:8px}
.split-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 32px;gap:8px;align-items:center}
.split-row .amt{font-family:var(--mono);font-size:12.5px;color:var(--fg-3);text-align:right}
.pct-in{position:relative}
.pct-in input{padding-right:26px;text-align:right}
.pct-in::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:13px}
@media (max-width:520px){.split-row{grid-template-columns:minmax(0,1fr) 90px 32px}.split-row .amt{display:none}}
.split-sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--panel-2);border-radius:4px;font-size:13.5px}
.split-sum .over{color:var(--neg);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-strong);border-radius:4px;cursor:pointer;background:var(--card)}
.mode:has(input:checked){border-color:var(--struct);background:var(--panel-2)}
.mode input[type=radio]{margin-top:3px;accent-color:var(--struct)}
.mode > span{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:14px}
.mode > span .muted{font-size:13px}
.inline-field{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.inline-field label{font-size:12.5px;color:var(--fg-2)}
.inline-field input,.inline-field select{width:auto;flex:1 1 150px;height:34px}

/* Drop zone */
.drop{border:1px dashed var(--line-strong);border-radius:4px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel-2);cursor:pointer;transition:background .12s var(--ease)}
.drop:hover,.drop.over{background:var(--panel)}
.drop strong{font-weight:600}
.preview-tbl td,.preview-tbl th{padding:6px 10px;font-size:12.5px}
.preview-tbl td{font-family:var(--mono)}
th.mapped{color:var(--fg);background:var(--panel)}

/* Modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));animation:fade .15s var(--ease)}
.modal{background:var(--bg);border-radius:4px;box-shadow:var(--shadow);width:100%;max-width:560px;margin-block:auto;display:flex;flex-direction:column;animation:rise .18s var(--ease)}
.modal.wide{max-width:860px}
.m-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:20px;letter-spacing:-.02em}
.m-head .icon-btn{margin-left:auto}
.m-body{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.m-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.m-foot .left{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fbfaf7;padding:10px 16px;border-radius:4px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* Empty / onboarding */
.empty{border:1px dashed var(--line-strong);border-radius:4px;padding:40px 20px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{color:var(--fg);font-size:18px;letter-spacing:-.02em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:28px}
.step{border:1px solid var(--line-strong);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.step .n{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--struct)}
.step h3{font-size:17px;letter-spacing:-.02em}
.step p{color:var(--fg-2);font-size:14px}
.step .btn{align-self:flex-start;margin-top:auto}
.step.done{background:var(--panel);border-color:var(--panel)}
.step.done .n::after{content:" · DONE"}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--struct);background:none;border:0;padding:0;cursor:pointer;font-size:14px;margin-bottom:14px}
.back:hover{text-decoration:underline}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);letter-spacing:.04em;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px}
.ro-banner{background:var(--panel);padding:10px 16px;border-radius:4px;font-size:14px;margin-bottom:20px}

/* Statement */
.stmt{border:1px solid var(--line-strong);border-radius:4px;padding:24px;background:var(--card)}
.stmt-head{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;padding-bottom:16px;border-bottom:3px solid var(--struct);margin-bottom:16px}
.stmt-head .right{margin-left:auto;text-align:right}
.stmt-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;gap:12px;flex-wrap:wrap}
.stmt-total .v{font-size:26px;font-weight:600;letter-spacing:-.03em}
.sched{margin-bottom:16px}
.sched th:first-child{color:var(--struct);font-size:11px}
.sched td{padding:8px 14px}
.sched-edit{margin-bottom:22px;display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;gap:10px;align-items:center}
.sec-name{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:12px!important;max-width:420px;color:var(--struct)}
.sched-edit td{padding:6px 8px;vertical-align:top}
.sched-edit td input[type=text]{height:34px}
.note-in{margin-top:4px;height:28px!important;font-size:12.5px;color:var(--fg-2)}
.rate-in{display:flex;gap:6px}
.rate-in select{width:118px;flex:none;height:34px}
.rate-in input{text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:4px;padding:4px 6px;background:var(--card);min-height:38px}
.tags input{border:0!important;height:28px!important;flex:1 1 120px;width:auto!important;padding:0 4px!important;outline:none!important;background:transparent}
.tags:focus-within{outline:2px solid var(--action)}
.tag-x{border:0;background:none;padding:0;margin-left:2px;cursor:pointer;color:var(--fg-3);display:inline-flex}
.tag-x svg{width:12px;height:12px}
.plat-row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) minmax(0,1.2fr) 32px;gap:10px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
@media (max-width:640px){.plat-row{grid-template-columns:1fr}}
.ledger{margin-top:14px;border-top:1px solid var(--line-strong)}
.ledger td{padding:8px 14px;font-size:14px}

/* Engine sections */
.who{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--struct)}
.who:empty{display:none}
.who + .sync{margin-left:14px}
.secnav{margin-top:-8px;margin-bottom:24px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px;padding:18px 20px;background:var(--panel);border-radius:4px;margin-bottom:8px}
.kv > div{min-width:0;overflow-wrap:anywhere}
.kv .label{display:block;margin-bottom:2px}
.sec-title{display:flex;align-items:center;gap:12px;margin:32px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:19px;letter-spacing:-.02em}
.sec-title .btn{margin-left:auto}
.mini-bar{height:6px;border-radius:2px;background:var(--struct);min-width:2px}
.mini-bar.neg{background:var(--neg)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person img{width:28px;height:28px;border-radius:50%;flex:none}
.results{border:1px solid var(--line-strong);border-radius:4px;max-height:260px;overflow:auto;background:var(--card)}
.results:empty{display:none}
.results button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border:0;background:transparent;text-align:left;cursor:pointer}
.results button:hover{background:var(--panel)}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 110px 32px;gap:8px;align-items:center}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.role-card{border:1px solid var(--line-strong);border-radius:4px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.role-card b{font-size:15px}
.role-card p{font-size:13.5px;color:var(--fg-2)}
tr.me td{background:var(--panel-2)}
.search input[type=text]{padding-left:34px}
</style>

<header class="top">

  let s = String(v ?? '').trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^-|^−|-$/.test(s.replace(/[$\s]/g, ''));

}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');

  const d = (first.split('\t').length > first.split(',').length) ? '\t' : (first.split(';').length > first.split(',').length + 1 ? ';' : ',');

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== '')).map(r => r.map(x => String(x).trim()));
}

    }
    h += `</tbody><tfoot><tr><td>Totals</td><td></td><td class="r num">${money(sum(rows, x => x.earned ?? x.amount))}</td><td class="r num">${money(sum(rows, x => x.carryIn))}</td>${hasPrior ? `<td class="r num">${money(-sum(rows, x => x.priorPaid))}</td>` : ''}<td class="r num">${money(sum(rows, x => Math.max(0, x.amount)))}</td><td colspan="2" class="muted" style="font-weight:400">${t.carryOut ? `${money(t.carryOut)} carries forward` : ''}</td></tr></tfoot></table></div>`;

      <td><div class="chips">${l.splits.map(s => `<span class="chip">${esc(payeeById(s.payeeId)?.name || s.name)} <b>${pct(s.pct)} · ${money(s.amount)}</b></span>`).join('') || '<span class="muted">No splits</span>'}</div></td><td class="r num">${money(l.house)}</td></tr>`;

/* ---------- run detail loading ---------- */
async function ensureDetail(r) {
  const key = r.id + '|' + r.calculatedAt;
  if (S.detailKey === key || !S.db) return;
  S.detailKey = key; S.detail = null;
  try {
    const lp = [], up = [];
    for (let i = 0; i < (r.lineChunks || 0); i++) lp.push(S.db.doc(`runs/${r.id}/lines/c${i}`).get());
    for (let i = 0; i < (r.unmatchedChunks || 0); i++) up.push(S.db.doc(`runs/${r.id}/unmatched/c${i}`).get());
    const [ls, us] = await Promise.all([Promise.all(lp), Promise.all(up)]);
    if (S.detailKey !== key) return;
    S.detail = {lines: ls.flatMap(s => s.data()?.items || []), unmatched: us.flatMap(s => s.data()?.items || [])};
    render();
  } catch (e) { S.detailKey = null; toast('Run detail could not be loaded. Try again in a moment.'); }
}
async function getDetail(r) {
  if (S.detail && S.detailKey === r.id + '|' + r.calculatedAt) return S.detail;
  S.detailKey = null; await ensureDetail(r); return S.detail;
}

/* ---------- split versions ---------- */
// A deal keeps every split it has had, each with the first month it applies to.
// '0000-00' means "from the start". A run uses the version in effect for its own month.
const curMonth = () => new Date().toISOString().slice(0, 7);
const versionsOf = d => (d.versions && d.versions.length ? [...d.versions] : [{from: '0000-00', splits: d.splits || []}]).sort((a, b) => a.from.localeCompare(b.from));
function splitsFor(d, month) {
  const vs = versionsOf(d); let hit = null;
  for (const v of vs) if (v.from <= month) hit = v;
  return hit ? {from: hit.from, splits: hit.splits || []} : {from: null, splits: []};
}
const fromLabel = f => !f || f === '0000-00' ? 'From the start' : 'From ' + monthShort(f);
function versionLabel(vs, i) { const end = vs[i + 1]?.from; const [y, mo] = (end || '').split('-').map(Number); const until = end ? new Date(y, mo - 2, 1).toLocaleDateString('en-US', {month: 'short', year: 'numeric'}) : ''; return fromLabel(vs[i].from) + (end ? ' to ' + until : ' onward'); }
const sameSplits = (a, b) => { const k = x => JSON.stringify([...x].filter(s => s.payeeId && +s.pct > 0).map(s => [s.payeeId, +s.pct]).sort()); return k(a) === k(b); };
const latestFinalMonth = () => S.runs.filter(r => r.status === 'approved' || r.status === 'paid').map(r => r.month).sort().pop() || null;
function nextOpenMonth() { const lf = latestFinalMonth(); if (!lf) return prevMonth(); const [y, mo] = lf.split('-').map(Number); const d = new Date(y, mo, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
const dealUsesPayee = (d, id) => versionsOf(d).some(v => (v.splits || []).some(s => s.payeeId === id));

/* ---------- ledger ---------- */
const finalized = r => r.status === 'approved' || r.status === 'paid';
// Balance carried into `month`: the negative balance left by the latest finalized run before it,
// or a payee's opening balance when that is newer than the run.
function carryFor(month) {
  const prior = S.runs.filter(r => r.month < month && finalized(r)).sort((a, b) => b.month.localeCompare(a.month))[0];
  const map = {};
  if (prior) for (const [id, t] of Object.entries(prior.payeeTotals || {})) if (t.amount < 0) map[id] = t.amount;
  for (const p of S.payees) {
    if (!p.openingBalance || !p.openingMonth || p.openingMonth > month) continue;
    if (!prior || prior.month < p.openingMonth) map[p.id] = p.openingBalance;
  }
  return {map, from: prior ? {month: prior.month, stamp: prior.approvedAt || ''} : null};
}
function carryStale(r) {
  if (r.status !== 'draft') return false;
  const cur = carryFor(r.month).map; const pt = r.payeeTotals || {};
  const ids = new Set([...Object.keys(cur), ...Object.keys(pt)]);
  for (const id of ids) if ((cur[id] || 0) !== (pt[id]?.carryIn || 0)) return true;
  return false;
}
function payeeBalance(id) { return carryFor('9999-99').map[id] || 0; }
const laterFinal = r => S.runs.filter(x => x.month > r.month && finalized(x)).sort((a, b) => a.month.localeCompare(b.month));
const earlierDraft = r => S.runs.filter(x => x.month < r.month && x.status === 'draft').sort((a, b) => a.month.localeCompare(b.month));
const histEntry = (action, note) => ({action, note: note || '', at: nowIso(), by: S.uid || null});

/* ---------- calculation ---------- */
function calculate(rows, month, priorPaid) {
  const byMid = new Map();
  for (const r of rows) {
    const k = normMid(r.mid); if (!k || r.net == null) continue;
    const cur = byMid.get(k) || {mid: r.mid, fileMerchant: r.merchant || '', net: 0, detail: null};
    cur.net += r.net; if (!cur.fileMerchant && r.merchant) cur.fileMerchant = r.merchant;
    cur.detail = mergeDetail(cur.detail, r.detail);
    byMid.set(k, cur);
  }
  const dealBy = new Map(S.deals.map(d => [normMid(d.mid), d]));
  const lines = [], unmatched = [], payeeTotals = {};
  for (const [k, r] of byMid) {
    const d = dealBy.get(k);
    if (!d) { unmatched.push({mid: r.mid, merchant: r.fileMerchant, net: r.net}); continue; }
    const ver = splitsFor(d, month);
    const splits = ver.splits.filter(s => s.payeeId && +s.pct > 0).map(s => ({payeeId: s.payeeId, name: payeeName(s.payeeId), pct: +s.pct, amount: Math.round(r.net * (+s.pct) / 100)}));
    const house = r.net - sum(splits, s => s.amount);
    lines.push({dealId: d.id, merchant: d.merchant, mid: d.mid, fileMerchant: r.fileMerchant, net: r.net, splits, house, splitFrom: ver.from});
    for (const s of splits) { const t = payeeTotals[s.payeeId] ||= {name: s.name, earned: 0, deals: 0}; t.earned += s.amount; t.deals++; }
  }
  const carry = carryFor(month);
  const slot = id => payeeTotals[id] ||= {name: payeeName(id), earned: 0, deals: 0};
  for (const [id, c] of Object.entries(carry.map)) if (c) slot(id).carryIn = c;
  for (const [id, c] of Object.entries(priorPaid || {})) if (c) slot(id).priorPaid = c;
  for (const t of Object.values(payeeTotals)) { t.carryIn ||= 0; t.priorPaid ||= 0; t.amount = t.earned + t.carryIn - t.priorPaid; }
  const vals = Object.values(payeeTotals);
  const matchedNet = sum(lines, l => l.net), unmatchedNet = sum(unmatched, u => u.net), partners = sum(vals, t => t.earned);
  const stmts = [...byMid.values()].filter(x => x.detail).map(x => ({mid: x.mid, merchant: x.fileMerchant, net: x.net, d: x.detail}));
  const file = {};
  for (const x of stmts) for (const [k, v] of Object.entries(x.d)) if (typeof v === 'number' && !NON_SUM.test(k)) file[k] = Math.round(((file[k] || 0) + v) * 100) / 100;
  return {lines, unmatched, payeeTotals, stmts, carryFrom: carry.from, totals: {
    rows: rows.length, merchants: byMid.size, file: stmts.length ? file : null, net: matchedNet + unmatchedNet, matchedNet, partners, house: matchedNet - partners, unmatchedNet, lines: lines.length, unmatchedCount: unmatched.length,
    carryIn: sum(vals, t => t.carryIn), priorPaid: sum(vals, t => t.priorPaid), payable: sum(vals, t => Math.max(0, t.amount)), carryOut: sum(vals, t => Math.min(0, t.amount)),
  }};
}
async function saveRun(month, calc, meta, prev) {
  const db = S.db; const lc = chunk(calc.lines, 200), uc = chunk(calc.unmatched, 800);
  for (let i = 0; i < lc.length; i++) await db.doc(`runs/${month}/lines/c${i}`).set({items: lc[i]});
  for (let i = 0; i < uc.length; i++) await db.doc(`runs/${month}/unmatched/c${i}`).set({items: uc[i]});
  for (let i = lc.length; i < (prev?.lineChunks || 0); i++) await db.doc(`runs/${month}/lines/c${i}`).delete();
  for (let i = uc.length; i < (prev?.unmatchedChunks || 0); i++) await db.doc(`runs/${month}/unmatched/c${i}`).delete();
  const sc = chunk(calc.stmts || [], 40); const stmtIndex = {};
  sc.forEach((c, i) => c.forEach(x => { stmtIndex[normMid(x.mid)] = {c: i, v: Math.round(volOf(x.d) * 100), r: x.net}; }));
  for (let i = 0; i < sc.length; i++) await db.doc(`runs/${month}/stmts/c${i}`).set({items: sc[i]});
  for (let i = sc.length; i < (prev?.stmtChunks || 0); i++) await db.doc(`runs/${month}/stmts/c${i}`).delete();
  await db.doc(`runs/${month}`).set({
    stmtChunks: sc.length, stmtIndex,
    month, status: 'draft', sourceFile: meta.sourceFile || prev?.sourceFile || '', calculatedAt: nowIso(), uploadedBy: S.uid || null,
    totals: calc.totals, payeeTotals: calc.payeeTotals, paid: {}, lineChunks: lc.length, unmatchedChunks: uc.length,
    carryFrom: calc.carryFrom || null, priorPaid: meta.priorPaid || prev?.priorPaid || {},
    history: [...(prev?.history || []), histEntry(meta.action || 'Calculated', meta.note)].slice(-200),
  });
}

function writeErr(e) {

    const clean = splits.filter(s => s.payeeId && +s.pct > 0).map(s => ({payeeId: s.payeeId, pct: +s.pct}));
    const ids = clean.map(s => s.payeeId); if (new Set(ids).size !== ids.length) { toast('Each payee can appear once per deal. Combine their percentages.'); return; }

/* ---------- residual import ---------- */
function prevMonth() { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.toISOString().slice(0, 7); }

    const mo = replacing ? month : $('#i-month', m).value;
    const calc = ok ? calculate(rows, mo, runById(mo)?.priorPaid) : null;
    $('#i-summary', m).innerHTML = ok ? `<div class="split-sum"><span><b class="num">${rows.length}</b> rows read</span><span><b class="num">${calc.totals.lines}</b> matched to deals</span><span class="${calc.totals.unmatchedCount ? 'over' : ''}"><b class="num">${calc.totals.unmatchedCount}</b> unmatched</span><span>Net <b class="num">${money(calc.totals.net)}</b></span><span>Partners earn <b class="num">${money(calc.totals.partners)}</b></span>${calc.totals.carryIn ? `<span>Balances carried in <b class="num">${money(calc.totals.carryIn)}</b></span>` : ''}${skipped ? `<span class="muted">${skipped} rows skipped (no MID or amount)</span>` : ''}</div>`
      : imp.map.mid >= 0 && imp.map.net >= 0 && skipped ? `<div class="note">None of the ${skipped} rows has both a merchant ID and an amount, so nothing can be paid out. Check that the report's ${esc((imp.rows[imp.headerRow - 1] || [])[imp.map.mid] || 'MID')} column is filled in.</div>`
      : `<div class="note">Choose the merchant ID and net residual columns.</div>`;
    const hdr = imp.rows?.[imp.headerRow - 1] || [];
    if (hdr.some(x => /^agentNetSplit$/i.test(x))) $('#i-summary', m).insertAdjacentHTML('afterbegin', `<div class="note info">Processor residual report recognized. Payvori's residual is the <b>${esc(hdr[imp.map.net] || '')}</b> column${/agentProfit/i.test(hdr[imp.map.net] || '') ? ' (Payvori\'s split after any sub-agent payouts)' : ''}. Every column is kept, so each merchant gets a statement and the run gets a full residual report.${imp.fileMonth ? ` Month taken from the report: ${esc(monthLabel(imp.fileMonth))}.` : ''}</div>`);
    $('#i-go', m).disabled = !ok;
    $('#i-status', m).textContent = '';
  }
  $('#i-go', m).onclick = async e => {
    const mo = replacing ? month : $('#i-month', m).value;
    if (!/^\d{4}-\d{2}$/.test(mo)) { toast('Choose the residual month.'); return; }
    if (!needWrite()) return;
    const existing = runById(mo);
    if (existing && existing.status !== 'draft') { toast(`${monthLabel(mo)} is already ${existing.status}. Undo it first.`); return; }
    const later = laterFinal({month: mo});
    if (later.length) { toast(`${monthLabel(later[later.length - 1].month)} is already approved. Undo later runs before running an earlier month, so balances carry forward in order.`); return; }
    const {rows} = parsed(); const calc = calculate(rows, mo, existing?.priorPaid);
    const h = imp.rows[imp.headerRow - 1] || [];
    const mapping = {mid: h[imp.map.mid] || '', name: h[imp.map.name] || '', net: h[imp.map.net] || ''};
    if (existing && !replacing) { if (!await confirmModal({title: 'Replace draft', text: `A draft for ${esc(monthLabel(mo))} already exists. Replace it with this report?`, ok: 'Replace draft'})) return; }
    const btn = $('#i-go'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; } else toast('Saving run…');
    try {
      await S.db.doc('settings/import').set({residualMap: mapping});
      await saveRun(mo, calc, {sourceFile: imp.file, action: existing ? 'Report replaced' : 'Calculated', note: imp.file}, existing);
      closeModal(); toast('Run calculated.'); go('run', {runId: mo, tab: calc.totals.unmatchedCount ? 'unmatched' : 'payees'});
    } catch (err) { toast(writeErr(err)); if (btn?.isConnected) { btn.disabled = false; btn.textContent = 'Calculate payouts'; } }
  };
}

    st.map = {mid: guessCol(h, [/^mid$/i, /merchant\s*(id|#)/i, /mid/i]), merchant: guessCol(h, [/^merchant$/i, /dba/i, /merchant\s*name/i, /merchant/i]), payee: guessCol(h, [/payee/i, /agent/i, /partner/i, /rep/i, /^name$/i]), pct: guessCol(h, [/pct|percent|%|split|share/i]), role: guessCol(h, [/role|type/i]), email: guessCol(h, [/e-?mail/i])}; draw(); }; rd.readAsText(f); };

  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });
  function plan() {
    const deals = new Map(); const newPayees = new Map(); const errs = [];
    const known = new Map(S.payees.map(p => [p.name.trim().toLowerCase(), p.id]));
    st.rows.slice(1).forEach((r, i) => {
      const mid = r[st.map.mid] || '', merchant = r[st.map.merchant] || '', payee = (r[st.map.payee] || '').trim(); const p = parseFloat(String(r[st.map.pct] || '').replace(/[^0-9.]/g, ''));
      if (!normMid(mid)) return;
      const k = normMid(mid); const d = deals.get(k) || {mid, merchant, splits: []}; if (!d.merchant && merchant) d.merchant = merchant; deals.set(k, d);
      if (!payee || !(p > 0)) return;
      const key = payee.toLowerCase(); if (!known.has(key) && !newPayees.has(key)) newPayees.set(key, {name: payee, role: (st.map.role >= 0 && ROLES.find(x => x.toLowerCase() === String(r[st.map.role]).toLowerCase())) || 'Agent', email: st.map.email >= 0 ? r[st.map.email] || '' : ''});
      const ex = d.splits.find(s => s.key === key); if (ex) ex.pct += p; else d.splits.push({key, pct: p});
    });
    for (const d of deals.values()) if (sum(d.splits, s => s.pct) > 100.0001) errs.push(`${d.merchant || d.mid}: splits add up to ${pct(sum(d.splits, s => s.pct))}`);

    $('#di-map', m).innerHTML = `<div class="stack" style="gap:14px"><div class="grid3">${sel('mid', 'MID')}${sel('merchant', 'Merchant')}${sel('payee', 'Payee name')}${sel('pct', 'Percent')}${sel('role', 'Payee role', true)}${sel('email', 'Payee email', true)}</div>
      ${p ? `<div class="split-sum"><span><b class="num">${p.deals.length}</b> deals</span><span><b class="num">${p.deals.length - existing}</b> new</span><span><b class="num">${existing}</b> existing${existing ? ` · new split from ${esc(fromM ? monthShort(fromM) : '?')}` : ''}</span><span><b class="num">${p.newPayees.length}</b> new payees</span></div>${p.errs.length ? `<div class="note">${p.errs.slice(0, 5).map(esc).join('<br>')}${p.errs.length > 5 ? `<br>and ${p.errs.length - 5} more` : ''}</div>` : ''}` : '<div class="note">Map the MID, merchant, payee and percent columns.</div>'}</div>`;
    $$('#di-map select', m).forEach(s => s.onchange = () => { st.map[s.dataset.k] = +s.value; draw(); });
    $('#di-go', m).disabled = !p || p.errs.length > 0 || !p.deals.length || (existing > 0 && !fromM);
  }
  $('#di-from', m).addEventListener('change', () => { if (st.rows) draw(); });
  $('#di-go', m).onclick = e => {
    if (!needWrite()) return; const p = plan(); const fromM = $('#di-from', m).value;
    busy(e.currentTarget, async () => {
      try {
        const ids = new Map(p.known);
        for (const np of p.newPayees) { const ref = S.db.collection('payees').doc(); await ref.set({...np, method: 'ACH', payRef: '', notes: '', createdAt: nowIso(), updatedAt: nowIso()}); ids.set(np.name.toLowerCase(), ref.id); }
        for (const d of p.deals) {
          const ex = S.deals.find(x => normMid(x.mid) === normMid(d.mid));
          const sp = d.splits.map(s => ({payeeId: ids.get(s.key), pct: Math.round(s.pct * 1000) / 1000}));
          const stamp = {at: nowIso(), by: S.uid || null, note: 'Imported'};
          let versions;
          if (!ex) versions = [{from: '0000-00', splits: sp, ...stamp}];
          else { const vs = versionsOf(ex); if (sameSplits(splitsFor(ex, fromM).splits, sp)) continue; versions = [...vs.filter(v => v.from !== fromM), {from: fromM, splits: sp, ...stamp}].sort((a, b) => a.from.localeCompare(b.from)); }
          const data = {merchant: d.merchant || ex?.merchant || d.mid, mid: d.mid, processor: ex?.processor || '', platform: ex?.platform || null, frontEnd: ex?.frontEnd || '', backEnd: ex?.backEnd || '', notes: ex?.notes || '', versions, splits: splitsFor({versions}, curMonth()).splits, updatedAt: nowIso(), createdAt: ex?.createdAt || nowIso()};
          await (ex ? S.db.doc('deals/' + ex.id) : S.db.collection('deals').doc()).set(data);
        }
        closeModal(); toast(`Imported ${p.deals.length} deals.`);
      } catch (err) { toast(writeErr(err)); }
    });
  };
}

/* ---------- statements & exports ---------- */
function statementData(r, payeeId, detail) {
  const items = [];
  for (const l of detail.lines) for (const s of l.splits) if (s.payeeId === payeeId) items.push({merchant: l.merchant, mid: l.mid, net: l.net, pct: s.pct, amount: s.amount});
  items.sort((a, b) => b.amount - a.amount);
  const pe = payeeById(payeeId); const t = r.payeeTotals?.[payeeId];
  const earned = sum(items, i => i.amount);
  return {name: pe?.name || t?.name || 'Payee', role: pe?.role || '', email: pe?.email || '', items, total: earned, carryIn: t?.carryIn || 0, priorPaid: t?.priorPaid || 0, due: t?.amount ?? earned, paid: r.paid?.[payeeId], ref: `RS-${r.month}-${payeeId.slice(0, 6).toUpperCase()}`};
}
function statementBody(r, s) {
  return `<div class="stmt"><div class="stmt-head"><div><div class="eyebrow">Residual statement</div><h3 style="font-size:22px;letter-spacing:-.02em">${esc(s.name)}</h3><div class="muted">${esc(s.role)}${s.email ? ' · ' + esc(s.email) : ''}</div></div>
    <div class="right"><div class="label">Period</div><div style="font-weight:600">${esc(monthLabel(r.month))}</div><div class="cell-sub" style="margin-top:4px">${esc(s.ref)}</div></div></div>
    <div class="tbl-wrap" style="border:0"><table><thead><tr><th>Merchant</th><th class="r">Net residual</th><th class="r">Your share</th><th class="r">Earned</th></tr></thead><tbody>
    ${s.items.map(i => `<tr><td><div class="cell-main">${esc(i.merchant)}</div><div class="cell-sub">MID ${esc(i.mid)}</div></td><td class="r num">${money(i.net)}</td><td class="r num">${pct(i.pct)}</td><td class="r num">${money(i.amount)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No residuals this period.</td></tr>'}
    </tbody></table></div>
    <table class="ledger"><tbody>
      <tr><td>Earned this period · ${s.items.length} merchants</td><td class="r num">${money(s.total)}</td></tr>
      <tr><td>Balance carried in from prior periods</td><td class="r num">${money(s.carryIn)}</td></tr>
      ${s.priorPaid ? `<tr><td>Already paid for this period</td><td class="r num">${money(-s.priorPaid)}</td></tr>` : ''}
    </tbody></table>
    <div class="stmt-total"><span class="muted">${s.due < 0 ? 'Negative balance carried forward to the next period' : s.paid ? `Paid ${esc(dateLabel(s.paid.date))}${s.paid.ref ? ' · ' + esc(s.paid.ref) : ''}` : r.status === 'draft' ? 'Draft, not yet approved' : 'Approved, payment pending'}</span><span><span class="label">${s.due < 0 ? 'Balance carried forward' : 'Amount due'}</span> <span class="v num">${money(s.due)}</span></span></div></div>`;
}
function statementFile(r, s) {
  const css = `body{font-family:'Instrument Sans',Helvetica,Arial,sans-serif;color:#231f1e;background:#fbfaf7;margin:0;padding:40px 24px;font-size:14px}main{max-width:760px;margin:0 auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:28px}.top b{font-size:20px;letter-spacing:-.035em}.top span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:#737a84;margin-left:auto}h3{margin:0}.eyebrow,.label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#4a5a6c}.muted{color:#5f6670}.stmt-head{display:flex;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:3px solid #4a5a6c;margin-bottom:8px}.right{text-align:right}table{width:100%;border-collapse:collapse}th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#737a84;text-align:left;padding:10px 8px;border-bottom:1px solid #cdd2d9;font-weight:500}td{padding:9px 8px;border-bottom:1px solid #e0e3e7}.r{text-align:right}.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}.cell-main{font-weight:500}.cell-sub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#737a84}.stmt-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px}.v{font-size:24px;font-weight:600;margin-left:8px}.ledger{margin-top:12px;border-top:1px solid #cdd2d9}footer{margin-top:40px;padding-top:12px;border-top:1px solid #e0e3e7;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#737a84}`;

async function showStatement(r, payeeId) {
  const det = await getDetail(r); if (!det) return;
  const s = statementData(r, payeeId, det);
  const m = openModal({wide: true, title: 'Statement', body: statementBody(r, s), foot: `<button class="btn" id="st-csv">${ic('download')}CSV</button><button class="btn primary" id="st-html">${ic('download')}Download statement</button>`});
  const base = `residual-statement-${r.month}-${s.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`;
  $('#st-html', m).onclick = () => saveFile(base + '.html', statementFile(r, s));
  $('#st-csv', m).onclick = () => saveFile(base + '.csv', toCSV([['Period', 'Payee', 'Merchant', 'MID', 'Net residual', 'Split %', 'Earned'], ...s.items.map(i => [r.month, s.name, i.merchant, i.mid, moneyPlain(i.net), i.pct, moneyPlain(i.amount)]), ['', '', '', '', '', 'Earned', moneyPlain(s.total)], ['', '', '', '', '', 'Carried in', moneyPlain(s.carryIn)], ...(s.priorPaid ? [['', '', '', '', '', 'Already paid', moneyPlain(-s.priorPaid)]] : []), ['', '', '', '', '', s.due < 0 ? 'Carried forward' : 'Amount due', moneyPlain(s.due)]]));

function exportPayments(r) {
  const rows = [['Payee', 'Role', 'Email', 'Payment method', 'Payment reference', 'Amount', 'Period', 'Memo', 'Statement ref', 'Status']];
  const entries = Object.entries(r.payeeTotals || {}).filter(([, t]) => t.amount > 0).sort((a, b) => b[1].amount - a[1].amount);
  for (const [id, t] of entries) { const p = payeeById(id) || {}; rows.push([p.name || t.name, p.role || '', p.email || '', p.method || 'ACH', p.payRef || '', moneyPlain(t.amount), r.month, `Residuals ${monthShort(r.month)}`, `RS-${r.month}-${id.slice(0, 6).toUpperCase()}`, r.paid?.[id] ? 'Paid' : 'Unpaid']); }
  saveFile(`residual-payments-${r.month}.csv`, toCSV(rows));
}
async function exportDetail(r) {
  const det = await getDetail(r); if (!det) return;
  const rows = [['Period', 'Merchant', 'MID', 'Net residual', 'Payee', 'Split %', 'Amount']];
  for (const l of det.lines) { for (const s of l.splits) rows.push([r.month, l.merchant, l.mid, moneyPlain(l.net), payeeById(s.payeeId)?.name || s.name, s.pct, moneyPlain(s.amount)]); rows.push([r.month, l.merchant, l.mid, moneyPlain(l.net), 'House', '', moneyPlain(l.house)]); }
  for (const u of det.unmatched) rows.push([r.month, u.merchant, u.mid, moneyPlain(u.net), 'Unmatched', '', moneyPlain(u.net)]);
  for (const [id, t] of Object.entries(r.payeeTotals || {})) {
    const n = payeeById(id)?.name || t.name;
    if (t.carryIn) rows.push([r.month, 'Balance carried in', '', '', n, '', moneyPlain(t.carryIn)]);
    if (t.priorPaid) rows.push([r.month, 'Already paid for this period', '', '', n, '', moneyPlain(-t.priorPaid)]);
    if (t.amount < 0) rows.push([r.month, 'Balance carried forward', '', '', n, '', moneyPlain(t.amount)]);
  }
  saveFile(`residual-detail-${r.month}.csv`, toCSV(rows));
}
function downloadDealTemplate() {

    <div class="grid2"><div class="field"><label for="mp-date">Payment date</label><input type="date" id="mp-date" value="${today}"></div>
    <div class="field"><label for="mp-ref">Reference</label><input type="text" id="mp-ref" placeholder="ACH batch or check number"></div></div>
    <div class="tbl-wrap"><table><thead><tr><th style="width:32px"></th><th>Payee</th><th class="r">Amount</th></tr></thead><tbody>
    ${pos.map(([id, t]) => `<tr><td><input type="checkbox" id="mp-${esc(id)}" data-id="${esc(id)}" ${!onlyId || onlyId === id ? 'checked' : ''}></td><td><label for="mp-${esc(id)}">${esc(payeeById(id)?.name || t.name)}</label></td><td class="r num">${money(t.amount)}</td></tr>`).join('')}
    </tbody></table></div><p class="muted" id="mp-total" style="font-size:13px"></p>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="mp-go">Mark paid</button>`});
  const upd = () => { const ids = $$('input[data-id]:checked', m).map(i => i.dataset.id); $('#mp-total', m).textContent = `${ids.length} selected · ${money(sum(ids, id => r.payeeTotals[id].amount))}`; $('#mp-go', m).disabled = !ids.length; };
  m.addEventListener('change', upd); upd();
  $('#mp-go', m).onclick = e => {
    if (!needWrite()) return;
    const ids = $$('input[data-id]:checked', m).map(i => i.dataset.id); const date = $('#mp-date', m).value || today, ref = $('#mp-ref', m).value.trim();
    busy(e.currentTarget, async () => {
      try {
        const paid = {...(r.paid || {})}; ids.forEach(id => paid[id] = {date, ref, amount: r.payeeTotals[id].amount, by: S.uid || null, at: nowIso()});
        const allPaid = Object.entries(r.payeeTotals || {}).filter(([, t]) => t.amount > 0).every(([id]) => paid[id]);
        const note = `${ids.length} payee${ids.length > 1 ? 's' : ''} · ${money(sum(ids, id => r.payeeTotals[id].amount))}${ref ? ' · ' + ref : ''}`;
        await S.db.doc('runs/' + r.id).update({paid, status: allPaid ? 'paid' : 'approved', ...(allPaid ? {paidAt: nowIso()} : {}), history: [...(r.history || []), histEntry('Marked paid', note)]});
        closeModal(); toast(allPaid ? 'All payees paid. Run closed.' : `${ids.length} marked paid.`);
      } catch (err) { toast(writeErr(err)); }
    });
  };
}

/* ---------- undo ---------- */
function undoModal(r) {
  if (!needWrite()) return;
  const later = laterFinal(r);
  if (later.length) return toast(`Undo ${monthLabel(later[later.length - 1].month)} first. Later runs depend on the balances this one carries forward.`);
  const paid = Object.entries(r.paid || {});
  const m = openModal({title: `Undo ${esc(monthLabel(r.month))}`, body: `
    <p>The run goes back to a draft and is recalculated with the current deals and carried balances. The uploaded report is kept, so you can rerun it, replace the report or fix deals before approving again.</p>
    ${paid.length ? `<div class="stack" style="gap:8px"><span class="flabel">Payments already marked paid</span>
      <p class="muted" style="font-size:13.5px">Ticked payments are recorded as already paid for this month and subtracted on the rerun, so nobody is paid twice. If the rerun comes out lower, the difference carries forward as a negative balance. Untick a payment only if it was never sent.</p>
      <div class="tbl-wrap"><table><thead><tr><th style="width:32px"></th><th>Payee</th><th>Paid</th><th class="r">Amount</th></tr></thead><tbody>
      ${paid.map(([id, p]) => `<tr><td><input type="checkbox" id="u-${esc(id)}" data-id="${esc(id)}" checked></td><td><label for="u-${esc(id)}">${esc(payeeById(id)?.name || r.payeeTotals?.[id]?.name || 'Payee')}</label></td><td class="muted">${esc(dateLabel(p.date))}${p.ref ? ' · ' + esc(p.ref) : ''}</td><td class="r num">${money(p.amount ?? r.payeeTotals?.[id]?.amount)}</td></tr>`).join('')}
      </tbody></table></div></div>` : ''}
    <div class="field"><label for="u-note">Reason</label><input type="text" id="u-note" placeholder="For example: wrong report uploaded, split corrected on one deal"></div>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="u-go">Undo and rerun</button>`});
  $('#u-go', m).onclick = e => busy(e.currentTarget, async () => {
    try {
      const det = await getDetail(r); if (!det) return;
      const priorPaid = {...(r.priorPaid || {})};
      $$('input[data-id]:checked', m).forEach(i => { const id = i.dataset.id; priorPaid[id] = (priorPaid[id] || 0) + (r.paid[id].amount ?? r.payeeTotals?.[id]?.amount ?? 0); });
      const rows = await rerunRows(r, det);
      const calc = calculate(rows, r.month, priorPaid); calc.totals.rows = r.totals?.rows || rows.length;
      await saveRun(r.month, calc, {action: 'Undone', note: $('#u-note', m).value.trim(), priorPaid}, r);
      closeModal(); toast(`${monthLabel(r.month)} is a draft again and has been rerun.`);
    } catch (err) { toast(writeErr(err)); }
  });
}

/* ---------- actions ---------- */
const actions = {
  'new-run': () => importModal(),
  'open-run': d => go('run', {runId: d.id}),
  'tab': d => { S.runTab = d.tab; render(); },
  'new-deal': () => dealModal(null),
  'edit-deal': d => dealModal(S.deals.find(x => x.id === d.id)),
  'deal-from': d => dealModal(null, {mid: d.mid, merchant: d.name}),
  'import-deals': () => dealImportModal(),
  'new-payee': () => payeeModal(null),
  'edit-payee': d => payeeModal(payeeById(d.id)),
  'tpl-deals': () => downloadDealTemplate(),
  'tpl-residual-old': () => saveFile('sample-residual-report.csv', toCSV([['Merchant ID', 'DBA Name', 'Sales Volume', 'Transactions', 'Net Residual'], ['4445001234567', 'Example Coffee Co', '84210.55', '3120', '612.40'], ['4445009876543', 'Example Auto Repair', '151002.10', '402', '1288.95'], ['', 'Report total', '235212.65', '3522', '1901.35']])),
  'replace-file': () => { const r = runById(S.runId); if (r) importModal(r.month, true); },
  'statement': d => { const r = runById(S.runId); if (r) showStatement(r, d.id); },
  'export-pay': () => { const r = runById(S.runId); if (r) exportPayments(r); },
  'export-detail': () => { const r = runById(S.runId); if (r) exportDetail(r); },
  'mark-paid': d => { const r = runById(S.runId); if (r) markPaidModal(r, d.id); },
  'recalc': async (d, btn) => {
    const r = runById(S.runId); if (!r || !needWrite()) return;
    if (r.status !== 'draft') return toast('Only draft runs can be recalculated.');
    const det = await getDetail(r); if (!det) return;
    const rows = await rerunRows(r, det);
    const calc = calculate(rows, r.month, r.priorPaid); calc.totals.rows = r.totals?.rows || rows.length;
    await busy(btn, async () => { try { await saveRun(r.month, calc, {sourceFile: r.sourceFile, action: 'Rerun'}, r); toast('Run recalculated with current deals and balances.'); } catch (err) { toast(writeErr(err)); } });
  },
  'approve': async () => {
    const r = runById(S.runId); if (!r || !needWrite()) return;
    const ed = earlierDraft(r); if (ed.length) return toast(`Approve ${monthLabel(ed[0].month)} first, so its balances carry into this month.`);
    if (laterFinal(r).length) return toast('A later month is already approved. Undo it first.');
    if (carryStale(r)) return toast('Carried balances have changed. Recalculate this run before approving.');
    const t = r.totals || {}; const n = Object.values(r.payeeTotals || {}).filter(x => x.amount > 0).length;
    const ok = await confirmModal({title: 'Approve run', text: `Approve ${esc(monthLabel(r.month))}: ${money(t.payable ?? t.partners)} due to ${n} payees.${t.carryOut ? ` ${money(t.carryOut)} in negative balances carries forward to the next run.` : ''}${t.unmatchedCount ? ` ${t.unmatchedCount} unmatched MIDs (${money(t.unmatchedNet)}) will not be paid out.` : ''} You can undo this run later and rerun it.`, ok: 'Approve'});
    if (!ok) return;
    try { await S.db.doc('runs/' + r.id).update({status: 'approved', approvedAt: nowIso(), approvedBy: S.uid || null, history: [...(r.history || []), histEntry('Approved')]}); toast('Run approved. Download the payment file next.'); } catch (err) { toast(writeErr(err)); }
  },
  'undo': () => { const r = runById(S.runId); if (r) undoModal(r); },
  'delete-run': async () => {
    const r = runById(S.runId); if (!r || !needWrite()) return;
    if (r.status !== 'draft') return toast('Only draft runs can be deleted. Undo the run first.');
    if (Object.values(r.priorPaid || {}).some(v => v)) return toast('Payments were already sent for this month, so the run is kept to net them off. Rerun it instead of deleting.');
    if (!await confirmModal({title: 'Delete run', text: `Delete the ${esc(monthLabel(r.month))} draft? You can upload the report again later.`, ok: 'Delete', danger: true})) return;
    try {
      for (let i = 0; i < (r.lineChunks || 0); i++) await S.db.doc(`runs/${r.id}/lines/c${i}`).delete();
      for (let i = 0; i < (r.unmatchedChunks || 0); i++) await S.db.doc(`runs/${r.id}/unmatched/c${i}`).delete();
      for (let i = 0; i < (r.stmtChunks || 0); i++) await S.db.doc(`runs/${r.id}/stmts/c${i}`).delete();
      await S.db.doc('runs/' + r.id).delete(); go('runs'); toast('Run deleted.');
    } catch (err) { toast(writeErr(err)); }
  },
};

/* ---------- pricing: processors, schedules ---------- */
const rid = p => p + Math.random().toString(36).slice(2, 8);
const normName = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const procById = id => S.processors.find(p => p.id === id);
function platLabel(procId, platId) {
  const p = procById(procId); if (!p) return '';
  const pl = (p.platforms || []).find(x => x.id === platId);
  return pl ? `${p.name} · ${pl.name}` : p.name;
}
const schedPlatforms = s => { const p = procById(s.processorId); if (!p) return 'No processor'; const ids = s.platformIds || []; return ids.length ? ids.map(id => platLabel(s.processorId, id)).join(', ') : `${p.name} · all platforms`; };
const backFromSched = s => { S.edit = null; if (s?.kind === 'cost') go('costs'); else if (s?.payeeId && payeeById(s.payeeId)) go('org', {orgId: s.payeeId, tab: 'pricing'}); else go('orgs'); };
const RATE_TYPES = [['pct', '%'], ['amt', '$'], ['pass', 'Pass-through'], ['na', 'N/A']];
function fmtRate(r) {
  if (!r || r.t === 'na') return 'N/A';
  if (r.t === 'pass') return 'Pass-through';
  if (r.v == null || r.v === '') return '—';
  const d = Math.max(2, r.d || 0); const s = Math.abs(r.v).toFixed(d); const neg = r.v < 0 ? '−' : '';
  return r.t === 'pct' ? `${neg}${s}%` : `${neg}$${s}`;
}
function parseRateInput(str) {
  const s = String(str ?? '').trim(); if (!s) return {v: null, d: 0};
  const n = parseFloat(s.replace(/[^0-9.\-]/g, '')); const d = (s.split('.')[1] || '').replace(/[^0-9]/g, '').length;
  return {v: isNaN(n) ? null : n, d};
}
const rateInputVal = r => (!r || r.v == null) ? '' : r.v.toFixed(Math.max(r.d || 0, 0));
function costLookup(s) {
  const m = new Map(); if (s.kind !== 'agent') return m;
  const mine = s.platformIds || [];
  for (const c of S.schedules.filter(x => x.kind === 'cost' && x.processorId === s.processorId && (!(x.platformIds || []).length || !mine.length || x.platformIds.some(p => mine.includes(p)))))
    for (const sec of c.sections || []) for (const it of sec.items || []) { const k = normName(it.name); if (!m.has(k) && it.rate && it.rate.v != null) m.set(k, it.rate); }
  return m;
}
function marginOf(buy, cost) {
  if (!buy || !cost || buy.v == null || cost.v == null || buy.t !== cost.t || !['pct', 'amt'].includes(buy.t)) return null;
  return {t: buy.t, v: Math.round((buy.v - cost.v) * 1e6) / 1e6, d: Math.max(buy.d || 2, cost.d || 2)};
}
const itemCount = s => sum(s.sections || [], sec => (sec.items || []).length);

function viewPricing() {

function editSet(path, value) {
  const s = S.edit; if (!s) return false;
  const [kind, a, b, f] = path.split(':');
  if (kind === 'hdr') { s[a] = value; if (a === 'processorId') { s.platformIds = []; return true; } return false; }
  if (kind === 'plat') { const set = new Set(s.platformIds || []); value ? set.add(a) : set.delete(a); s.platformIds = [...set]; return false; }
  if (kind === 'sec') { s.sections[+a].name = value; return false; }
  if (kind === 'item') {
    const it = s.sections[+a].items[+b];
    if (f === 'name' || f === 'note') { it[f] = value; return f === 'name'; }
    if (f === 'rev') { const n = parseFloat(String(value).replace(/[^0-9.]/g, '')); it.rev = String(value).trim() === '' || isNaN(n) ? null : n; return false; }
    if (f === 'rt') { const old = it.rate || {}; it.rate = value === 'pct' || value === 'amt' ? {t: value, v: old.v ?? null, d: old.d || 2} : {t: value}; return true; }
    if (f === 'rv') { const r = parseRateInput(value); it.rate = {t: it.rate?.t || 'amt', v: r.v, d: r.d}; return true; }
  }
  return false;
}

}

function finYears() { const ys = new Set([String(new Date().getFullYear())]); S.runs.forEach(r => ys.add(r.month.slice(0, 4))); S.ledger.forEach(e => e.date && ys.add(e.date.slice(0, 4))); return [...ys].sort().reverse(); }
function finData(year) {
  const months = new Map();
  const slot = k => { if (!months.has(k)) months.set(k, {month: k, net: 0, payouts: 0, other: 0, exp: 0, vol: 0, gross: 0, cost: 0, run: null}); return months.get(k); };
  for (const r of S.runs) if (r.month.startsWith(year)) { const s = slot(r.month); const t = r.totals || {}; s.net = t.net || 0; s.payouts = t.partners || 0; s.run = r; const f = t.file || {}; s.vol = Math.round(((f.bankcardSalesVolume || 0) + (f.bankcardSalesVolumeAmex || 0)) * 100); s.gross = Math.round((f.totalIncome || 0) * 100); s.cost = Math.round((f.agentExpense || 0) * 100); }
  for (const e of S.ledger) if ((e.date || '').startsWith(year)) { const s = slot(e.date.slice(0, 7)); if (e.type === 'Income') s.other += e.amount || 0; else s.exp += e.amount || 0; }
  const rows = [...months.values()].sort((a, b) => a.month.localeCompare(b.month));
  rows.forEach(s => { s.margin = s.net - s.payouts; s.income = s.margin + s.other - s.exp; });
  return rows;
}

  }
  const led = S.ledger.filter(e => (e.date || '').startsWith(y));
  h += `<div class="sec-title"><h2>Ledger</h2><span class="label">${led.length} entries</span><button class="btn sm" data-act="new-ledger">${ic('plus')}Add entry</button></div>`;

const NON_SUM = /percent|average|^id$|yearmonth|^group$/i;
function readSheet(buf) {
  const X = window.XLSX; if (!X) throw new Error('xlsx');
  const wb = X.read(buf, {type: 'array', cellDates: true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws, {header: 1, raw: true, defval: ''})
    .map(r => r.map(v => v instanceof Date ? v.toISOString().slice(0, 10) : String(v ?? '').trim()))
    .filter(r => r.some(x => x !== ''));
}
function rowDetail(headers, r) {
  const d = {}; let n = 0;
  headers.forEach((h, i) => {
    const k = String(h || '').trim().replace(/[.\/\[\]#$]/g, '_'); if (!k || /^id$/i.test(k) || n >= 160) return;
    const v = String(r[i] ?? '').trim(); if (!v) return;
    const num = Number(v);
    if (!isNaN(num)) { if (num !== 0) { d[k] = num; n++; } } else { d[k] = v.slice(0, 120); n++; }
  });
  return n ? d : null;
}
function mergeDetail(a, b) {
  if (!a) return b ? {...b} : null; if (!b) return a;
  for (const [k, v] of Object.entries(b)) {
    if (typeof v === 'number' && typeof a[k] === 'number' && !NON_SUM.test(k)) a[k] = Math.round((a[k] + v) * 1e6) / 1e6;
    else if (!(k in a)) a[k] = v;
  }
  return a;
}
const volOf = d => (d?.bankcardSalesVolume || 0) + (d?.bankcardSalesVolumeAmex || 0);
const txOf = d => (d?.transactionCount || 0) + (d?.transactionCountAmex || 0);
const usd = v => money(Math.round((v || 0) * 100));
const custByMid = mid => S.customers.find(c => (c.mids || []).some(x => normMid(x) === normMid(mid)));
async function getStmts(r) {
  const key = r.id + '|' + r.calculatedAt; S.stmtCache ||= {};
  if (S.stmtCache[key]) return S.stmtCache[key];
  if (!S.db || !r.stmtChunks) return [];
  const docs = await Promise.all(Array.from({length: r.stmtChunks}, (_, i) => S.db.doc(`runs/${r.id}/stmts/c${i}`).get()));
  return (S.stmtCache[key] = docs.flatMap(x => x.data()?.items || []));
}
async function getStmt(r, mid) {
  const e = r.stmtIndex?.[normMid(mid)]; if (!e || !S.db) return null;
  const all = S.stmtCache?.[r.id + '|' + r.calculatedAt];
  if (all) return all.find(x => normMid(x.mid) === normMid(mid)) || null;
  const doc = await S.db.doc(`runs/${r.id}/stmts/c${e.c}`).get();
  return (doc.data()?.items || []).find(x => normMid(x.mid) === normMid(mid)) || null;
}
async function rerunRows(r, det) {
  const by = new Map((await getStmts(r)).map(x => [normMid(x.mid), x.d]));
  return [...det.lines.map(l => ({mid: l.mid, merchant: l.fileMerchant || '', net: l.net})), ...det.unmatched]

/* ---------- labels for report columns ---------- */
const ACR = {Avs: 'AVS', Pci: 'PCI', Irs: 'IRS', Ebt: 'EBT', Pin: 'PIN', Pos: 'POS'};
function fieldLabel(k, suffix) {
  let t = suffix && k.endsWith(suffix) ? k.slice(0, -suffix.length) : k;
  t = t.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
  return t.split(' ').filter(Boolean).map((w, i) => { if (w.length > 1 && w === w.toUpperCase()) return w; const c = w.charAt(0).toUpperCase() + w.slice(1); return ACR[c] || (i ? w.toLowerCase() : c); }).join(' ');
}
function stmtParts(d) {
  const inc = [], exp = [], sub = [];
  for (const [k, v] of Object.entries(d || {})) {
    if (typeof v !== 'number') continue;
    if (/SubAgentExpense$/.test(k)) { if (k !== 'subAgentExpense') sub.push([fieldLabel(k, 'SubAgentExpense'), v]); }
    else if (/AgentExpense$/.test(k)) { if (k !== 'agentExpense') exp.push([fieldLabel(k, 'AgentExpense'), v]); }
    else if (/Income$/.test(k) && k !== 'totalIncome') inc.push([fieldLabel(k, 'Income'), v]);
  }
  const iOther = (d?.totalIncome || 0) - sum(inc, x => x[1]);
  const eOther = (d?.agentExpense || 0) - sum(exp, x => x[1]);
  if (Math.abs(iOther) >= 0.005) inc.unshift(['Discount and other income (not itemized)', Math.round(iOther * 100) / 100]);
  if (Math.abs(eOther) >= 0.005) exp.unshift(['Interchange, assessments and other costs (not itemized)', Math.round(eOther * 100) / 100]);
  return {inc, exp, sub};
}

async function showMerchantStatement(runId, mid) {

/* ---------- residual report (per run) ---------- */
function reportRows(r, stmts, det) {
  const lineBy = new Map(det.lines.map(l => [normMid(l.mid), l]));
  const items = stmts.length ? stmts : [...det.lines.map(l => ({mid: l.mid, merchant: l.fileMerchant || l.merchant, net: l.net, d: null})), ...det.unmatched.map(u => ({mid: u.mid, merchant: u.merchant, net: u.net, d: null}))];
  return items.map(x => { const l = lineBy.get(normMid(x.mid)) || null; const c = custByMid(x.mid); const d = x.d || {};
    return {mid: x.mid, dba: c?.dba || l?.merchant || x.merchant || d.dba || '', cust: c, d, residual: x.net, orgs: l ? sum(l.splits, y => y.amount) : 0, keeps: l ? l.house : x.net, line: l};
  }).sort((a, b) => b.residual - a.residual);
}
function ensureReport(r) {
  const key = r.id + '|' + r.calculatedAt;

  return null;
}

      ${hasD ? `<td class="r num">${usd(volOf(x.d))}</td><td class="r num">${txOf(x.d)}</td><td class="r num">${usd(x.d.totalIncome)}</td><td class="r num">${usd(x.d.agentExpense)}</td><td class="r num">${usd(x.d.agentNet)}</td><td class="r num muted">${x.d.agentSplitPercent != null ? pct(x.d.agentSplitPercent) : '—'}</td>` : ''}

async function cidFromReport(r, btn) {
  if (!needWrite()) return;
  const st = await getStmts(r); const seen = new Set();
  const todo = st.filter(x => !custByMid(x.mid) && !seen.has(normMid(x.mid)) && seen.add(normMid(x.mid)));
  if (!todo.length) return toast('Every merchant in this report is already in the CID.');
  if (!await confirmModal({title: 'Add merchants to CID', text: `Create ${todo.length} customer record${todo.length === 1 ? '' : 's'} from the ${esc(monthLabel(r.month))} report? Each gets its DBA, legal name, MID, status and boarding date from the report, and is matched to an organization when the report's agent name matches one.`, ok: `Add ${todo.length}`})) return;
  const byName = new Map(S.payees.map(p => [p.name.trim().toLowerCase(), p.id]));
  let n = parseInt(nextNo(S.customers, 'cidNumber', 'C-', 10001).slice(2), 10);
  const label = btn?.innerHTML; if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  try {
    for (const x of todo) {
      const d = x.d || {}; const stt = String(d.accountStatus || d.merchantStatus || '');
      await upsert('customers', null, {dba: String(d.dba || x.merchant || 'MID ' + x.mid), legalName: String(d.legalBusinessName || ''), status: /clos/i.test(stt) ? 'Closed' : /activ|open/i.test(stt) ? 'Active' : 'Pending',
        openedDate: String(d.boardedAt || '').slice(0, 10), closedDate: String(d.accountClosedAt || '').slice(0, 10), orgId: byName.get(String(d.agentName || '').trim().toLowerCase()) || '',
        contactName: '', phone: '', email: '', address: '', city: '', state: '', zip: '', platform: null, mids: [x.mid], notes: `Added from the ${monthLabel(r.month)} residual report.`, cidNumber: 'C-' + (n++)});
    }
    toast(`${todo.length} merchants added to the CID.`);
  } catch (err) { toast(writeErr(err)); }
  finally { if (btn?.isConnected) { btn.disabled = false; btn.innerHTML = label; } }
}

  'report-html': async () => { const r = runById(S.runId); if (!r) return; const det = await getDetail(r); saveFile(`residual-report-${r.month}.html`, reportFile(r, reportRows(r, await getStmts(r), det))); },

(async () => {
